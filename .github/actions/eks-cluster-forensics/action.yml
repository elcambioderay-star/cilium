name: "EKS cluster forensics"
description: |
  Capture forensic data about an EKS cluster and the AWS resources behind it:
  the Kubernetes node and event state, the EKS cluster and nodegroup status, the
  subnets referenced by the cluster, the scaling activities of each nodegroup's
  Auto Scaling Group, eksctl's CloudFormation stacks and stack events, and the
  CloudTrail lookups that name the principal behind a DeleteNodegroup,
  DeleteCluster, DeleteStack, DeleteSubnet or TerminateInstances call. A pooled
  cluster torn down mid-run is otherwise only visible as workers that vanish,
  which reads like a Cilium regression. Every probe is best-effort and never
  fails the job. The result is written as eks-cluster-forensics-<suffix>-<phase>.tar.gz
  in the workspace, for the caller to upload together with the sysdumps.
inputs:
  artifacts_suffix:
    description: "Suffix added to the forensics tarball name. Used to distinguish artifacts from parallel matrix legs."
    required: true
  cluster_name:
    description: "Name of the EKS cluster to interrogate."
    required: true
  region:
    description: "AWS region of the cluster. Defaults to the region already configured in the environment."
    default: ""
  phase:
    description: "Distinguishes several collections within one job, e.g. node-loss from post."
    default: "post"
  node_baseline:
    description: "Path to a kubectl get nodes -o json taken while the cluster was healthy, unioned with the live node list so that already reaped nodes are still interrogated."
    default: ""
runs:
  using: composite
  steps:
    - name: Capture EKS cluster forensics
      shell: bash {0} # Disable default fail-fast so that every probe runs independently
      env:
        CLUSTER_NAME: ${{ inputs.cluster_name }}
        REGION: ${{ inputs.region }}
        NODE_BASELINE: ${{ inputs.node_baseline }}
        ARTIFACTS_SUFFIX: ${{ inputs.artifacts_suffix }}
        PHASE: ${{ inputs.phase }}
      run: |
        bash .github/actions/eks-cluster-forensics/action.sh "${ARTIFACTS_SUFFIX}" "${PHASE}"
